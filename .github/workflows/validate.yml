name: HACS validation

# HACS validation also checks repository settings (description, topics) and
# HACS updates its rules, neither of which triggers a push, so it runs weekly
# instead of on every merge to main.
on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
