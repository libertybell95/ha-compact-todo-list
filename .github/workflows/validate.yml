name: HACS validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          # README screenshots must come from a live dashboard (see docs/RELEASING.md).
          # Remove this once docs/images/ screenshots are added to the README.
          ignore: images
