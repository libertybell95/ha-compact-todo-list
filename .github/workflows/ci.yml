name: CI

# Runs on pull requests only. The "Protect main" ruleset requires this check
# to pass on an up-to-date branch before merging, so a run after the merge
# would test the same code again.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ha-compact-todo-card
          path: dist/ha-compact-todo-card.js
          if-no-files-found: error
